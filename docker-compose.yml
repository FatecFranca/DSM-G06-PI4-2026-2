services:
  backend:
    build: ./backend
    ports: ['3000:3000']
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/horta-comunitaria
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Broker público compartilhado com o simulador Wokwi
      MQTT_BROKER: mqtt://broker.hivemq.com:1883
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883' # MQTT TCP normal
      - '9001:9001' # MQTT via WebSocket (para uso futuro com ESP32 físico)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test:
        ['CMD', 'mosquitto_pub', '-h', 'localhost', '-t', 'healthcheck', '-n']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports: ['8080:80']
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
